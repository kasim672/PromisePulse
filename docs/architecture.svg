<text x="95" y="215" class="nodeTitle">Olist source CSVs</text><text x="95" y="238" class="nodeInfo">8 datasets · historical 2016–2018</text>
<rect x="76" y="286" width="360" height="78" class="node"/>
<text x="95" y="314" class="nodeTitle">Python + DuckDB ETL</text><text x="95" y="340" class="nodeInfo">Two fact grains · dimensions · checks</text>
