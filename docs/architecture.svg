<text x="56" y="60" class="heading">PromisePulse 5.0</text>
<text x="58" y="90" class="subtitle">Historical Olist data → static Parquet exports → browser SQL + soft-cyan research UI</text>
<rect x="48" y="122" width="421" height="430" class="panel" fill="url(#offline)"/>
<rect x="511" y="122" width="421" height="430" class="panel" fill="url(#static)"/>
