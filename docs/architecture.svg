<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
<title id="title">PromisePulse 5.0 soft-cyan application architecture</title>
<desc id="desc">Offline Olist CSV data passes through Python and DuckDB modeling, producing Parquet and JSON files. Vercel hosts those static files, and a React browser application uses a DuckDB WebAssembly worker to query them. Mining analysis results were generated offline. Soft-cyan #7DD3FC styles change appearance only.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#19283b"/></linearGradient>
 <linearGradient id="offline" x1="0" x2="1"><stop stop-color="#22577a"/><stop offset="1" stop-color="#21445f"/></linearGradient>
 <linearGradient id="static" x1="0" x2="1"><stop stop-color="#155e75"/><stop offset="1" stop-color="#164e63"/></linearGradient>
 <linearGradient id="browser" x1="0" x2="1"><stop stop-color="#424475"/><stop offset="1" stop-color="#303b67"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7DD3FC"/></marker>
 <style>
  text{font-family:Inter,Arial,Helvetica,sans-serif}
  .heading{fill:#f4f7fa;font-size:36px;font-weight:700}
  .subtitle{fill:#bdcad9;font-size:17px}
  .panel{stroke:#65758a;stroke-width:1.7;rx:18}
  .label{fill:#f5f8fc;font-size:21px;font-weight:700}
  .body{fill:#e0e8f2;font-size:15px}
  .micro{fill:#cad6e4;font-size:13px}
  .node{fill:#0e1c2b;stroke:#6099ba;stroke-width:1.2;rx:12}
  .nodeTitle{fill:#f6f8fb;font-size:18px;font-weight:650}
  .nodeInfo{fill:#c5d1df;font-size:14px}
  .arrow{fill:none;stroke:#7DD3FC;stroke-width:3;marker-end:url(#arrow)}
 </style>
</defs>
