<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">PromisePulse 5.0 — offline warehouse, browser analytics, and optional Gemini assistant</title>
<desc id="desc">Four clearly separated execution environments. Offline Python and DuckDB convert eight Olist CSV datasets to public Parquet and JSON. Vercel serves a React website, which queries Parquet in a browser DuckDB-Wasm worker. Separately, a Vercel serverless API retrieves server-side project documentation and optionally calls Google Gemini using a private key. No live production scoring or server-side SQL analytics.</desc>
