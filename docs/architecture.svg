   .lane {fill:#1b3046;stroke:#557186;stroke-width:1.5}
   .lane-head {fill:#7DD3FC;font-size:17px;font-weight:700;letter-spacing:.3px}
   .lane-sub {fill:#b3c9da;font-size:13px}
   .node {fill:#102235;stroke:#54758c;stroke-width:1.2}
