name: Capture verified current-release screenshots (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-cyan-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install source app and headless Chromium
        working-directory: web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify current V5 and cyan palette without altering app
        working-directory: web
        run: |
          npm run build
          node ../tests/test_soft_cyan_theme.cjs
          node ../tests/test_algorithm_playground.cjs
          test -s public/data/fact_orders.parquet
          test -s public/data/mining_lab.json
      - name: Serve bundled historical data
        working-directory: web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/cyan-docs-capture.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4173/data/manifest.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cyan-docs-capture.log
          exit 1
      - name: Capture all current-release pages, desktop and mobile
        working-directory: web
        env:
          PP_BASE_URL: http://127.0.0.1:4173/
        run: node scripts/capture-current-docs.mjs
      # Warehouse recovery is verified using rendered data, not a removed header badge.
      - name: Capture all five computed teaching algorithms and verify retries
        working-directory: web
        env:
          PP_BASE_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-algorithms.mjs
      - name: Verify screenshot count and palette provenance
        run: |
          test "$(find docs/screenshots/current -maxdepth 1 -name '*.png' | wc -l)" -ge 30
          node -e "const fs=require('fs');const d='docs/screenshots/current/';const a=JSON.parse(fs.readFileSync(d+'CAPTURE_MANIFEST.json'));const b=JSON.parse(fs.readFileSync(d+'ALGORITHM_CAPTURE_MANIFEST.json'));if(a.images.length!==15||b.images.length!==15||!a.release.includes('#7DD3FC'))process.exit(1);console.log('Captured',a.images.length+b.images.length,'authentic current-release screenshots')"
      - name: Attach screenshot set
        uses: actions/upload-artifact@v4
        with:
          name: promisepulse-release-docs-30-screenshots
          path: docs/screenshots/current/
          retention-days: 30
      - name: Commit verified screenshot binaries to main on manual capture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The build refreshes a tracked server-only knowledge index from docs.
          # Screenshot capture should not accidentally include it or block the rebase.
          git restore -- web/api/_site-index.mjs
          git add docs/screenshots/current/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh 30 real screenshots including light and dark assistant"
          git fetch --no-tags origin main
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/main
