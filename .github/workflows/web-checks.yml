name: PromisePulse Web Validation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run SQL generation regression tests
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules
        run: node ../tests/test_sql_generation.cjs
      - name: Verify light and dark theme coverage
        run: node ../tests/test_theme.cjs
      - name: Validate Analytics Atlas chart registry and SQL semantics
        run: node ../tests/test_atlas.cjs
      - name: Verify 12-route research expansion and 30 additional figures
        run: node ../tests/test_research_expansion.cjs
      - name: Verify six syllabus modules and empirical algorithms
        run: node ../tests/test_syllabus_modules.cjs
