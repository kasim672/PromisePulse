name: PromisePulse Web Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promisepulse-web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run SQL generation regression tests
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules
        run: node ../tests/test_sql_generation.cjs
      - name: Verify light and dark theme coverage
        run: node ../tests/test_theme.cjs
      - name: Verify expanded header search and removed connection badge
        run: node ../tests/test_header_search.cjs
      - name: Verify readable editorial hierarchy and absence of decorative micro-labels
        run: node ../tests/test_editorial_hierarchy.cjs
      - name: Validate Analytics Atlas chart registry and SQL semantics
        run: node ../tests/test_atlas.cjs
      - name: Verify 12-route research expansion and 30 additional figures
        run: node ../tests/test_research_expansion.cjs
      - name: Verify six syllabus modules and empirical algorithms
        run: node ../tests/test_syllabus_modules.cjs
      - name: Check five computed algorithm examples and recoverable data loading
        run: node ../tests/test_algorithm_playground.cjs
      - name: Verify published data-mining experimental integrity
        run: node ../tests/test_mining_export_integrity.cjs
      - name: Verify documentation, diagrams and current screenshots
        run: node ../tests/test_documentation.cjs
      - name: Verify Gemini project-only retrieval, secure server route and error handling
        run: node ../tests/test_gemini_assistant.mjs
      - name: Verify local ignored environment and Vite Gemini HTTP endpoint
        run: |
          npm run setup:gemini
          npm run setup:gemini
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/promisepulse-local-gemini.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/data/manifest.json >/dev/null; then break; fi
            sleep 1
          done
          node ../tests/test_gemini_local_http.mjs
