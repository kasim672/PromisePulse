name: Keep only main after PromisePulse merges
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-feature-branches.yml'
permissions:
  contents: write
jobs:
  clean-merged-feature-branches:
    if: github.repository == 'kasim672/PromisePulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete every remote branch except main
        run: |
          set -euo pipefail
          git ls-remote --heads origin | sed 's#^.*refs/heads/##' | while IFS= read -r branch; do
            if [ "$branch" = "main" ]; then
              echo "Preserving origin/main"
              continue
            fi
            git push origin --delete "$branch"
            echo "Deleted origin/$branch"
          done
          remaining="$(git ls-remote --heads origin | sed 's#^.*refs/heads/##')"
          printf 'Remaining remote branches:\n%s\n' "$remaining"
          test "$remaining" = main
