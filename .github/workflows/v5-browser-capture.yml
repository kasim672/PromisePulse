name: Capture syllabus labs from real exported Olist experiments
on:
  push:
    branches: ['feat/promisepulse-5-full-syllabus-review']
    paths: ['docs/V5_CAPTURE_REQUEST.md']
permissions:
  contents: write
jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install app and actual Chromium
        working-directory: web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Launch real source-backed web app
        working-directory: web
        run: |
          test -s public/data/mining_lab.json
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/pp-v5.log 2>&1 &
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4173/data/mining_lab.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pp-v5.log
          exit 1
      - name: Verify six routes and capture actual charts, both themes
        working-directory: web
        env:
          PP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/capture-v5.mjs
      - name: Commit screenshot evidence to feature branch
        run: |
          set -euo pipefail
          test -s docs/screenshots/v5/CAPTURE_MANIFEST.json
          test "$(find docs/screenshots/v5 -name '*.png' | wc -l)" -ge 19
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v5/
          git commit -m "docs(syllabus): capture genuine clustering, frequent patterns and six modules"
          git fetch --no-tags origin feat/promisepulse-5-full-syllabus-review
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/feat/promisepulse-5-full-syllabus-review
