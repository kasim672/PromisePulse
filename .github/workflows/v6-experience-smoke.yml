name: PromisePulse V6 browser and performance review
on:
  push:
    branches: ['feat/promisepulse-6-platform-experience']
    paths:
      - 'web/src/**'
      - 'web/scripts/smoke-v6.mjs'
      - 'tests/test_experience.cjs'
      - 'tests/test_performance_budget.cjs'
      - '.github/workflows/v6-experience-smoke.yml'
  workflow_dispatch:
concurrency:
  group: v6-experience-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v6-${{ runner.os }}-node22
      - name: Install web app and Chromium
        working-directory: web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build with splitting and verify data
        working-directory: web
        run: |
          npm run build
          test -s dist/data/manifest.json
          test -s dist/data/mining_lab.json
          test -s dist/data/fact_orders.parquet
          node ../tests/test_experience.cjs
          node ../tests/test_performance_budget.cjs
      - name: Run local website
        working-directory: web
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/promise-v6.log 2>&1 &
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4173/data/mining_lab.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/promise-v6.log
          exit 1
      - name: Exercise all new V6 interactions on desktop and mobile
        working-directory: web
        env:
          PP_BASE_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-v6.mjs
