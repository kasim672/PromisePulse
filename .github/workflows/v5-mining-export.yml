name: Export verified data-mining experiments
on:
  push:
    branches: ['feat/promisepulse-5-syllabus-mining-labs']
    paths: ['docs/V5_MINING_EXPORT_REQUEST.md']
permissions:
  contents: write
jobs:
  mining:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-export.txt
      - name: Install scientific stack
        run: python -m pip install -r requirements-export.txt
      - name: Run real Olist ML and data-mining experiments
        run: python scripts/build_mining_lab.py
      - name: Check quantitative output provenance
        run: python scripts/verify_mining_lab.py
      - name: Commit real offline experimental results to feature branch
        run: |
          set -euo pipefail
          test -s web/public/data/mining_lab.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/mining_lab.json
          git commit -m "data(mining): publish verified real Olist statistical and algorithm evaluation results"
          git fetch --no-tags origin feat/promisepulse-5-syllabus-mining-labs
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/feat/promisepulse-5-syllabus-mining-labs
